name: Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

# Jobs opt into the permissions they need
permissions: {}

jobs:
  # Builds the branch without write access: building runs project code (astro.config, component
  # frontmatter), which may be AI-generated, so it must not share a job with a write token.
  # Skips PRs from forks (their token can't push to gh-pages anyway).
  build:
    if: |
      github.event_name != 'delete' &&
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: preview-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      BASE_PATH: /${{ github.event.repository.name }}/${{ github.head_ref || github.ref_name }}/
      SITE: https://${{ github.repository_owner }}.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build # astro.config.mjs reads SITE and BASE_PATH

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # Publishes the built files to gh-pages under /<branch>/. Runs no project code.
  # Residual risk: previews go live before review, incl. AI-generated code from figma.yml and Figma-exported
  # SVGs (which run scripts when opened directly). They're served from <owner>.github.io, the origin shared by
  # all of the owner's Pages sites. If that matters, gate this job behind a required reviewer on the
  # `preview` environment (Settings → Environments), or publish previews from a separate account.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: preview-deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE_PATH: /${{ github.event.repository.name }}/${{ github.head_ref || github.ref_name }}/
      SITE: https://${{ github.repository_owner }}.github.io
    environment:
      name: preview
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref || github.ref_name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Disable Jekyll # so the _astro/ directory is served
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          target-folder: ${{ env.BRANCH }}
          clean: false # keep other branches' previews

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$SITE$BASE_PATH"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          # Also works for workflow_dispatch runs, e.g. triggered by figma.yml
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
              --body "🔍 **Preview:** $url (updated for ${GITHUB_SHA::7})"
          fi

  # Removes the preview when the PR is closed or the branch is deleted.
  cleanup:
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-deploy-${{ github.head_ref || github.event.ref }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ github.head_ref || github.event.ref }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Remove preview folder
        run: |
          if [ -n "$BRANCH" ] && [ -d "$BRANCH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rfq -- "$BRANCH"
            git commit -m "Remove preview for $BRANCH"
            git push
          else
            echo "No preview found for $BRANCH"
          fi
